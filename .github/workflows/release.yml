name: Release IPA

# Manual trigger: builds an UNSIGNED .ipa (app + embedded share extension).
# Sign and install it yourself (e.g. with Feather). No signing material ever goes in this repo.
on:
  workflow_dispatch:
    inputs:
      include_share_extension:
        description: "Include the share extension (turn off if your signing tool fails to install it)"
        type: boolean
        default: true

jobs:
  ipa:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build Release (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project RecipeReel.xcodeproj \
            -scheme RecipeReel \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet

      - name: Package .ipa
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/RecipeReel.app"
          APPEX="$APP/PlugIns/RecipeReelShare.appex"
          test -d "$APP" || { echo "::error::RecipeReel.app not found"; exit 1; }
          test -d "$APPEX" || { echo "::error::Share extension missing from PlugIns"; exit 1; }

          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          if [ "${{ inputs.include_share_extension }}" != "true" ]; then
            rm -rf out/Payload/RecipeReel.app/PlugIns
            echo "Share extension removed (input include_share_extension=false)"
          fi

          IPA="RecipeReel-${{ github.run_number }}.ipa"
          (cd out && zip -qry "$IPA" Payload && rm -rf Payload)
          cp App/RecipeReel.entitlements ShareExtension/RecipeReelShare.entitlements out/

          PB=/usr/libexec/PlistBuddy
          {
            echo "### RecipeReel build ${{ github.run_number }}"
            echo "- App: \`$($PB -c 'Print CFBundleIdentifier' "$APP/Info.plist")\` $($PB -c 'Print CFBundleShortVersionString' "$APP/Info.plist") ($($PB -c 'Print CFBundleVersion' "$APP/Info.plist"))"
            echo "- Share extension: \`$($PB -c 'Print CFBundleIdentifier' "$APPEX/Info.plist")\` (included: ${{ inputs.include_share_extension }})"
            echo "- IPA size: $(du -h "out/$IPA" | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: RecipeReel-ipa-${{ github.run_number }}
          path: out/
          retention-days: 30
          if-no-files-found: error
