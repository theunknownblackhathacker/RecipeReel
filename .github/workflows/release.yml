name: Release IPA

# Manual trigger: builds an UNSIGNED .ipa (app + embedded share extension) and publishes it
# as a GitHub Release asset, so you get a plain .ipa download (no zip).
#   This build:   https://github.com/<owner>/<repo>/releases/download/build-<N>/RecipeReel.ipa
#   Always latest: https://github.com/<owner>/<repo>/releases/latest/download/RecipeReel.ipa
# Sign and install it yourself (e.g. Feather). No signing material ever goes in this repo.
on:
  workflow_dispatch:
    inputs:
      include_share_extension:
        description: "Include the share extension (turn off if your signing tool fails to install it)"
        type: boolean
        default: true

permissions:
  contents: write   # needed to create the release

jobs:
  ipa:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build Release (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project RecipeReel.xcodeproj \
            -scheme RecipeReel \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" || {
            python3 .github/scripts/annotate-errors.py "$RUNNER_TEMP/xcodebuild.log" "xcodebuild failed"
            exit 1
          }

      - name: Package .ipa
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/RecipeReel.app"
          APPEX="$APP/PlugIns/RecipeReelShare.appex"
          test -d "$APP" || { echo "::error::RecipeReel.app not found"; exit 1; }
          test -d "$APPEX" || { echo "::error::Share extension missing from PlugIns"; exit 1; }

          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          if [ "${{ inputs.include_share_extension }}" != "true" ]; then
            rm -rf out/Payload/RecipeReel.app/PlugIns
            echo "Share extension removed (input include_share_extension=false)"
          fi
          (cd out && zip -qry RecipeReel.ipa Payload && rm -rf Payload)
          ls -la out

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="build-${{ github.run_number }}"
          PB=/usr/libexec/PlistBuddy
          INFO="build/Build/Products/Release-iphoneos/RecipeReel.app/Info.plist"
          VERSION="$($PB -c 'Print CFBundleShortVersionString' "$INFO") ($($PB -c 'Print CFBundleVersion' "$INFO"))"
          gh release create "$TAG" out/RecipeReel.ipa \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "RecipeReel $VERSION" \
            --notes "Unsigned IPA from commit ${{ github.sha }}. Share extension included: ${{ inputs.include_share_extension }}. Sign it yourself (e.g. Feather), keeping the bundle ID and extensions."
          URL="https://github.com/${{ github.repository }}/releases/download/$TAG/RecipeReel.ipa"
          {
            echo "### RecipeReel $VERSION"
            echo "- IPA: $URL"
            echo "- Latest: https://github.com/${{ github.repository }}/releases/latest/download/RecipeReel.ipa"
            echo "- Share extension included: ${{ inputs.include_share_extension }}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=IPA ready::$URL"
